services:
  - type: web
    name: cryptohub-trading
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
      - key: NEXT_PUBLIC_APP_NAME
        value: CryptoHub Institutional
      - key: JWT_SECRET
        generateValue: true
      - key: BTC_DEPOSIT_ADDRESS
        value: bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
      - key: ETH_DEPOSIT_ADDRESS
        value: 0x71C8407BEA758B540306E5D73A9dFcf38914A690
      - key: USDT_DEPOSIT_ADDRESS
        value: TXW29Zg3N8rR7Lq9n8rLkJH8zC41Q2K9mY
      - key: DEFAULT_USER_EMAIL
        value: trader@cryptohub.io
      - key: DEFAULT_USER_NAME
        value: Alex Sterling
